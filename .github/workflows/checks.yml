name: Build and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - name: Refresh platform dependency metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Check the committed lockfile
        run: git diff -- package-lock.json

      - name: Verify a clean install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build client and server
        run: npm run build
